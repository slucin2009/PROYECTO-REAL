name: campus_fix
description: "CampusFix - Gestión inteligente de objetos perdidos y mantenimiento institucional."
publish_to: 'none'

version: 0.1.3+4

environment:
  sdk: ^3.12.2

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.5

  flutter_riverpod: ^2.6.1

  firebase_core: ^4.13.0
  firebase_auth: ^6.5.7
  cloud_firestore: ^6.8.0
  firebase_storage: ^13.4.6
  firebase_messaging: ^16.5.0

  image_picker: ^0.8.9
  intl: ^0.20.2
  uuid: ^3.0.7
  shared_preferences: ^2.1.0
  package_info_plus: ^8.0.0
  url_launcher: ^6.3.0
  http: ^1.1.0

  flutter_localizations:
    sdk: flutter

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/images/